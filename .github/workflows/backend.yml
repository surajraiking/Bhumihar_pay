name: Validate Suraj Rai Pay Backend
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "tsconfig.server.json"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "server/**"
      - "tsconfig.server.json"
      - "package.json"
      - "package-lock.json"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run backend:typecheck
